<text x="24.0" y="32.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">The trade-off a flat fee cannot escape</text><text x="24.0" y="52.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">Each dot is one fee setting (mean of all seeds). Up = LPs keep more; left = retail pays less.</text><text x="24.0" y="68.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">A flat fee can only move along the dashed curve. Fairway settings sit above it. Simulated data.</text><line x1="80" x2="780" y1="345.7667959012375" y2="345.7667959012375" stroke="#c3c2b7"/><text x="72.0" y="349.8" font-size="11" fill="#898781" text-anchor="end" font-weight="400">$0</text><line x1="80" x2="780" y1="289.9220481470767" y2="289.9220481470767" stroke="#e1e0d9"/><text x="72.0" y="293.9" font-size="11" fill="#898781" text-anchor="end" font-weight="400">$500</text><line x1="80" x2="780" y1="234.0773003929159" y2="234.0773003929159" stroke="#e1e0d9"/><text x="72.0" y="238.1" font-size="11" fill="#898781" text-anchor="end" font-weight="400">$1,000</text><line x1="80" x2="780" y1="178.2325526387551" y2="178.2325526387551" stroke="#e1e0d9"/><text x="72.0" y="182.2" font-size="11" fill="#898781" text-anchor="end" font-weight="400">$1,500</text><line x1="80" x2="780" y1="122.38780488459426" y2="122.38780488459426" stroke="#e1e0d9"/><text x="72.0" y="126.4" font-size="11" fill="#898781" text-anchor="end" font-weight="400">$2,000</text><text x="80.0" y="402.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">0</text><text x="236.4" y="402.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">20</text><text x="392.8" y="402.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">40</text><text x="549.3" y="402.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">60</text><text x="705.7" y="402.0" font-size="11" fill="#898781" text-anchor="middle" font-weight="400">80</text><text x=