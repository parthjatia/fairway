<svg xmlns="http://www.w3.org/2000/svg" width="980" height="310" viewBox="0 0 980 310" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Backtest regimes comparison">
<rect width="980" height="310" fill="#fcfcfb" rx="8"/>
<text x="24.0" y="32.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Backtest: five fee regimes on the same simulated market</text><text x="24.0" y="52.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">8 seeds × 24h, 60% vol + jumps, $3M pool. Simulated data.</text><text x="24.0" y="66.0" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">LP PnL vs HODL ($/day)</text><text x="24.0" y="95.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Fairway 5/30/80</text><path d="M187.80643481344202,80 h4.470168689764165 q4,0 4,4 v14 q0,4 -4,4 h-4.470168689764165 z" fill="#2a78d6"><title>Fairway 5/30/80: $191</title></path><text x="200.3" y="95.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">$191</text><text x="24.0" y="129.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Flat 30 bps</text><path d="M187.80643481344202,114 h24.563898421320175 q4,0 4,4 v14 q0,4 -4,4 h-24.563898421320175 z" fill="#eb6834"><title>Flat 30 bps: $644</title></path><text x="220.4" y="129.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">$644</text><text x="24.0" y="163.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Fairway, rotation</text><path d="M187.80643481344202,148 h3.2779286680455186 q3.2779286680455186,0 3.2779286680455186,3.2779286680455186 v15.444142663908963 q0,3.2779286680455186 -3.2779286680455186,3.2779286680455186 h-3.2779286680455186 z" fill="#1baf7a"><title>Fairway, bots rotate wallets: $148</title></path><text x="198.4" y="163.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">$148</text><text x="24.0" y="197.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Flat 5 bps</text><path d="M187.80643481344202,182 h-9.806434813442024 q-4,0 -4,4 v14 q0,4 4,4 h9.806434813442024 z" fill="#eda100"><title>Flat 5 bps: −$311</title></path><text x="170.0" y="197.0" font-size="11" fill="#0b0b