ill="#52514e" text-anchor="start" font-weight="400">Flat 5 bps</text><path d="M814,182 h7.067292644757458 q4,0 4,4 v14 q0,4 -4,4 h-7.067292644757458 z" fill="#eda100"><title>Flat 5 bps: 9</title></path><text x="829.1" y="197.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">9</text><text x="664.0" y="231.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Flat 80 bps</text><path d="M814,216 h99.95937652582165 q4,0 4,4 v14 q0,4 -4,4 h-99.95937652582165 z" fill="#e87ba4"><title>Flat 80 bps: 80</title></path><text x="922.0" y="231.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">80</text><line x1="814" x2="814" y1="74" y2="242" stroke="#c3c2b7" stroke-width="1"/><text x="664.0" y="264.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">lower = fresher price</text>
