<svg xmlns="http://www.w3.org/2000/svg" width="900" height="534" viewBox="0 0 900 534" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Launch fee paid by humans vs snipers">
<rect width="900" height="534" fill="#fcfcfb" rx="8"/>
<text x="24.0" y="32.0" font-size="17" fill="#0b0b0b" text-anchor="start" font-weight="600">Launch fees: who pays? (bps, volume-weighted)</text><text x="24.0" y="52.0" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">200 simulated launches. Fairway cuts the human fee by 53% vs time-decay-only; known snipers pay 1.46×. Simulated data.</text><rect x="24" y="64" width="10" height="10" rx="2" fill="#1baf7a"/><text x="40.0" y="73.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Humans (retail buyers)</text><rect x="254" y="64" width="10" height="10" rx="2" fill="#eda100"/><text x="270.0" y="73.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">All snipers + bundlers</text><rect x="484" y="64" width="10" height="10" rx="2" fill="#d6455d"/><text x="500.0" y="73.0" font-size="11" fill="#52514e" text-anchor="start" font-weight="400">Known snipers (TOXIC)</text><text x="24.0" y="121.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Flat 30</text><path d="M200,92 h24.50069562956051 q4,0 4,4 v6 q0,4 -4,4 h-24.50069562956051 z" fill="#1baf7a"><title>Flat 30 · Humans (retail buyers): 30 bps</title></path><text x="232.5" y="103.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">30</text><path d="M200,109 h24.50069562956051 q4,0 4,4 v6 q0,4 -4,4 h-24.50069562956051 z" fill="#eda100"><title>Flat 30 · All snipers + bundlers: 30 bps</title></path><text x="232.5" y="120.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">30</text><path d="M200,126 h24.50069562956051 q4,0 4,4 v6 q0,4 -4,4 h-24.50069562956051 z" fill="#d6455d"><title>Flat 30 · Known snipers (TOXIC): 30 bps</title></path><text x="232.5" y="137.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">30</text><text x="24.0" y="188.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Time-decay</text><path d="M200,159 h186.6581945820704 q4,0 4,4 v6 q0,4 -4,4 h-186.6581945820704 z" fill="#1baf7a"><title>Time-decay · Humans (retail buyers): 201 bps</title></path><text x="394.7" y="170.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">201</text><path d="M200,176 h226.42133149920505 q4,0 4,4 v6 q0,4 -4,4 h-226.42133149920505 z" fill="#eda100"><title>Time-decay · All snipers + bundlers: 243 bps</title></path><text x="434.4" y="187.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">243</text><path d="M200,193 h232.55407033377685 q4,0 4,4 v6 q0,4 -4,4 h-232.55407033377685 z" fill="#d6455d"><title>Time-decay · Known snipers (TOXIC): 249 bps</title></path><text x="440.6" y="204.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">249</text><text x="24.0" y="255.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Decay 1000</text><path d="M200,226 h606 q4,0 4,4 v6 q0,4 -4,4 h-606 z" fill="#1baf7a"><title>Decay 1000 · Humans (retail buyers): 642 bps</title></path><text x="814.0" y="237.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">642</text><path d="M200,243 h292.7391032975023 q4,0 4,4 v6 q0,4 -4,4 h-292.7391032975023 z" fill="#eda100"><title>Decay 1000 · All snipers + bundlers: 312 bps</title></path><text x="500.7" y="254.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">312</text><path d="M200,260 h294.3325572396641 q4,0 4,4 v6 q0,4 -4,4 h-294.3325572396641 z" fill="#d6455d"><title>Decay 1000 · Known snipers (TOXIC): 314 bps</title></path><text x="502.3" y="271.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">314</text><text x="24.0" y="322.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Fairway</text><path d="M200,293 h85.51454592261098 q4,0 4,4 v6 q0,4 -4,4 h-85.51454592261098 z" fill="#1baf7a"><title>Fairway · Humans (retail buyers): 94 bps</title></path><text x="293.5" y="304.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">94</text><path d="M200,310 h229.82801299764407 q4,0 4,4 v6 q0,4 -4,4 h-229.82801299764407 z" fill="#eda100"><title>Fairway · All snipers + bundlers: 246 bps</title></path><text x="437.8" y="321.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">246</text><path d="M200,327 h340.89899165800375 q4,0 4,4 v6 q0,4 -4,4 h-340.89899165800375 z" fill="#d6455d"><title>Fairway · Known snipers (TOXIC): 363 bps</title></path><text x="548.9" y="338.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">363</text><text x="24.0" y="389.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Fairway + bundles</text><path d="M200,360 h85.51454592261098 q4,0 4,4 v6 q0,4 -4,4 h-85.51454592261098 z" fill="#1baf7a"><title>Fairway + bundles · Humans (retail buyers): 94 bps</title></path><text x="293.5" y="371.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">94</text><path d="M200,377 h231.84818980502678 q4,0 4,4 v6 q0,4 -4,4 h-231.84818980502678 z" fill="#eda100"><title>Fairway + bundles · All snipers + bundlers: 248 bps</title></path><text x="439.8" y="388.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">248</text><path d="M200,394 h336.91987653791443 q4,0 4,4 v6 q0,4 -4,4 h-336.91987653791443 z" fill="#d6455d"><title>Fairway + bundles · Known snipers (TOXIC): 359 bps</title></path><text x="544.9" y="405.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">359</text><text x="24.0" y="456.5" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="600">Fairway (rotation)</text><path d="M200,427 h85.51454592261098 q4,0 4,4 v6 q0,4 -4,4 h-85.51454592261098 z" fill="#1baf7a"><title>Fairway (rotation) · Humans (retail buyers): 94 bps</title></path><text x="293.5" y="438.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">94</text><path d="M200,444 h226.5518542349334 q4,0 4,4 v6 q0,4 -4,4 h-226.5518542349334 z" fill="#eda100"><title>Fairway (rotation) · All snipers + bundlers: 243 bps</title></path><text x="434.6" y="455.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">243</text><path d="M200,461 h232.6949549724128 q4,0 4,4 v6 q0,4 -4,4 h-232.6949549724128 z" fill="#d6455d"><title>Fairway (rotation) · Known snipers (TOXIC): 249 bps</title></path><text x="440.7" y="472.0" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="400">249</text><line x1="200" x2="200" y1="88" y2="482" stroke="#c3c2b7"/><text x="24.0" y="520.0" font-size="11" fill="#898781" text-anchor="start" font-weight="400">Rotation = worst case: every sniper uses a fresh wallet (STANDARD), so it pays exactly the time-decay fee.</text>
