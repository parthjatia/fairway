packages:
  - "packages/*"
  - "services/*"
  - "apps/*"
  - "streams"
  - "scripts"
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  # optional native accelerators with pure-JS fallbacks: not needed
  bigint-buffer: false
  bufferutil: false
  utf-8-validate: false
minimumReleaseAgeExclude:
  - lucide-react@1.75.0
